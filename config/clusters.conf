# TDTech Toolkit - GKE cluster profiles
#
# format: profile:project:location_type:location:cluster
#   profile        friendly name used with `main.sh gke use <profile>`.
#                  MUST start with 'prod' or 'nonprod' (e.g. 'prod-a',
#                  'nonprod-reporting') - this is how the toolkit picks
#                  which IAP bastion tunnel to open for the profile, so a
#                  single env can have many cluster profiles (even across
#                  different GCP projects) as long as they share the prefix.
#   project        GCP project ID
#   location_type  zone | region
#   location       GCP zone (e.g. asia-southeast1-a) or region (e.g. asia-southeast1)
#   cluster        GKE cluster name
#
# Fill in your real clusters below, one per line. Lines starting with '#' and
# blank lines are ignored.
#
# prod-a:tech-svc-prod:zone:asia-southeast1-a:CHANGEME-prod-cluster-a
# prod-b:tech-svc-prod-2:zone:asia-southeast1-a:CHANGEME-prod-cluster-b
# nonprod-a:tech-svc-nonprod:zone:asia-southeast1-a:CHANGEME-nonprod-cluster-a
# nonprod-b:tech-svc-nonprod:zone:asia-southeast1-a:CHANGEME-nonprod-cluster-b
prod-daap:cjx-data-product-prod:region:asia-southeast1:gke-cjx-data-product-prod-1
nonprod-daap:tech-data-daap:zone:asia-southeast1-a:gke-data-dp-nonprod-1
