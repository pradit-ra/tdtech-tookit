name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -o dist/tdtk-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/tdtk

      - uses: actions/upload-artifact@v4
        with:
          name: tdtk-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tdtk-${{ matrix.goos }}-${{ matrix.goarch }}
